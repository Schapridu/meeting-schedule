<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>График встреч перед проповедническим служением</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    

<style>
/* ===== FONTS & RESET ===== */
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: #EFE6D5;
    background-image: radial-gradient(#C8A45A 0.8px, transparent 0.8px);
    background-size: 24px 24px;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    color: #1B2A4A;
    line-height: 1.5;
    min-height: 100vh;
    padding: 30px 10px;
}

/* Word wrap for all text inputs */
input[type="text"] {
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Meeting PDF export button */
.export-pdf-btn--meeting {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 24px auto 16px;
    padding: 12px 28px;
    background: linear-gradient(135deg, #C8A45A, #C8A45A);
    color: #1B2A4A;
    border: none;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(200, 164, 90, 0.3);
}

.export-pdf-btn--meeting:hover {
    background: linear-gradient(135deg, #C8A45A, #C8A45A);
    box-shadow: 0 4px 12px rgba(200, 164, 90, 0.4);
    transform: translateY(-1px);
}

/* ===== APP CONTAINER ===== */
.app {
    max-width: 900px;
    margin: 20px auto;
    background: #FDF8F0;
    border: 4px double #C8A45A;
    border-radius: 4px;
    box-shadow: 0 20px 60px rgba(27, 42, 74, 0.15);
    position: relative;
    overflow: visible;
}

/* ===== NAV BAR ===== */
.nav-bar {
    background: #1B2A4A;
    padding: 0;
    border-radius: 12px 12px 0 0;
    display: flex;
    align-items: center;
}

.nav-bar__menu-wrapper {
    position: relative;
    flex: 1;
}

/* Language Switcher */
.lang-switcher {
    position: relative;
    margin-right: 16px;
}

.lang-switcher__btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border: 1px solid rgba(200, 164, 90, 0.4);
    border-radius: 6px;
    background: rgba(200, 164, 90, 0.1);
    color: #C8A45A;
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
}

.lang-switcher__btn:hover {
    background: rgba(200, 164, 90, 0.2);
    border-color: #C8A45A;
}

.lang-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    right: 0;
    background: #fff;
    border: 1px solid rgba(212, 168, 67, 0.3);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(27, 42, 74, 0.15);
    z-index: 200;
    overflow: hidden;
    min-width: 150px;
}

.lang-dropdown.open {
    display: block;
}

.lang-dropdown__item {
    display: block;
    width: 100%;
    padding: 10px 16px;
    border: none;
    background: transparent;
    color: #1B2A4A;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s;
    border-bottom: 1px solid rgba(212, 168, 67, 0.1);
}

.lang-dropdown__item:last-child {
    border-bottom: none;
}

.lang-dropdown__item:hover {
    background: rgba(212, 168, 67, 0.08);
}

.lang-dropdown__item.active {
    background: rgba(27, 42, 74, 0.06);
    font-weight: 700;
    border-left: 3px solid #C8A45A;
}

.nav-bar__menu-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 24px;
    border: none;
    background: transparent;
    color: #C8A45A;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    text-align: left;
}

.nav-bar__menu-btn:hover {
    background: rgba(200, 164, 90, 0.1);
}

.nav-bar__current-label {
    flex: 1;
    color: #fff;
    font-weight: 500;
}

.nav-bar__chevron {
    transition: transform 0.2s;
    color: #C8A45A;
}

.nav-bar__chevron.open {
    transform: rotate(180deg);
}

.nav-bar__dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid rgba(212, 168, 67, 0.3);
    border-radius: 0 0 10px 10px;
    box-shadow: 0 8px 24px rgba(27, 42, 74, 0.15);
    z-index: 100;
    overflow: hidden;
}

.nav-bar__dropdown.open {
    display: block;
}

.nav-bar__dropdown-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 12px 24px;
    border: none;
    background: transparent;
    color: #1B2A4A;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s;
    border-bottom: 1px solid rgba(212, 168, 67, 0.1);
}

.nav-bar__dropdown-item:last-child {
    border-bottom: none;
}

.nav-bar__dropdown-item:hover {
    background: rgba(212, 168, 67, 0.08);
}

.nav-bar__dropdown-item.active {
    background: rgba(27, 42, 74, 0.06);
    color: #1B2A4A;
    font-weight: 700;
    border-left: 3px solid #C8A45A;
}

.nav-bar__dropdown-item svg {
    flex-shrink: 0;
    color: #5A6A8A;
}

.nav-bar__dropdown-item.active svg {
    color: #C8A45A;
}

/* Placeholder page for upcoming schedules */
.schedule-placeholder {
    padding: 60px 32px;
    text-align: center;
}

.schedule-placeholder__icon {
    width: 80px;
    height: 80px;
    color: #C8A45A;
    margin: 0 auto 20px;
    opacity: 0.5;
}

.schedule-placeholder__title {
    font-family: 'Playfair Display', 'Georgia', serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: #1B2A4A;
    margin-bottom: 12px;
}

.schedule-placeholder__text {
    font-size: 0.9rem;
    color: #5A6A8A;
    line-height: 1.6;
    max-width: 400px;
    margin: 0 auto;
}

/* ===== HEADER ===== */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 32px 20px;
    border-bottom: 3px double #C8A45A;
    gap: 20px;
}

.header__logo {
    flex-shrink: 0;
}

.header__logo-icon {
    width: 76px;
    height: 76px;
}

.header__center {
    flex: 1;
    text-align: center;
}

.header__title {
    font-family: 'Playfair Display', 'Georgia', serif;
    font-size: 1.6rem;
    font-weight: 900;
    color: #1B2A4A;
    line-height: 1.2;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-transform: uppercase;
}

.header__subtitle {
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    color: #5A6A8A;
    font-style: italic;
    cursor: text;
    padding: 2px 8px;
    border-radius: 4px;
    transition: background 0.2s;
    outline: none;
}

.header__subtitle:hover,
.header__subtitle:focus {
    background: rgba(212, 168, 67, 0.1);
}

.header__badge {
    flex-shrink: 0;
}

.header__badge-inner {
    background: #1B2A4A;
    color: #C8A45A;
    padding: 12px 16px;
    border-radius: 6px;
    text-align: center;
    min-width: 80px;
}

.header__badge-label {
    display: block;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    margin-bottom: 2px;
}

.header__badge-number {
    display: block;
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 900;
    color: #C8A45A;
    cursor: text;
    outline: none;
}

/* ===== TIME BAR ===== */
.time-bar {
    display: flex;
    align-items: center;
    padding: 14px 32px;
    border-bottom: 1px solid rgba(212, 168, 67, 0.3);
    background: #FEFCF7;
    gap: 16px;
    flex-wrap: wrap;
}

.time-bar__left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.time-bar__icon {
    width: 32px;
    height: 32px;
    color: #1B2A4A;
}

.time-bar__label {
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #1B2A4A;
    white-space: nowrap;
}

.time-bar__controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
}

.time-bar__day-input {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    color: #1B2A4A;
    border: 2px solid #C8A45A;
    border-radius: 6px;
    padding: 6px 14px;
    background: #fff;
    text-transform: uppercase;
    letter-spacing: 1px;
    min-width: 180px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
}

.time-bar__day-input:focus {
    border-color: #C8A45A;
    box-shadow: 0 0 0 3px rgba(200, 164, 90, 0.15);
}

.time-bar__time-select {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    color: #1B2A4A;
    border: 2px solid #C8A45A;
    border-radius: 6px;
    padding: 6px 12px;
    background: #fff;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
}

.time-bar__time-select:focus {
    border-color: #C8A45A;
    box-shadow: 0 0 0 3px rgba(200, 164, 90, 0.15);
}

.time-bar__right {
    margin-left: auto;
}

.time-bar__people-icon {
    width: 36px;
    height: 36px;
    color: #1B2A4A;
}

/* ===== MONTH BLOCK ===== */
.month-block {
    border: 1px solid #C8A45A;
    border-radius: 4px;
    box-shadow: 3px 3px 0px rgba(200, 164, 90, 0.2);
    position: relative;

    position: relative;
    display: flex;
    margin: 20px 24px;
    border: 1px solid rgba(212, 168, 67, 0.25);
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 2px 12px rgba(27, 42, 74, 0.04);
    overflow: hidden;
    transition: box-shadow 0.2s;
}

.month-block:hover {
    box-shadow: 0 4px 20px rgba(27, 42, 74, 0.08);
}

.month-block__delete-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 28px;
    height: 28px;
    border: none;
    background: rgba(192, 57, 43, 0.08);
    color: #c0392b;
    font-size: 1.1rem;
    font-weight: 700;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    z-index: 2;
    opacity: 0;
}

.month-block:hover .month-block__delete-btn {
    opacity: 1;
}

.month-block__delete-btn:hover {
    background: #c0392b;
    color: #fff;
    transform: scale(1.1);
}

/* Sidebar */
.month-block__sidebar {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    min-width: 110px;
    background: linear-gradient(180deg, #FEFCF7 0%, #FDF8F0 100%);
    border-right: 1px solid rgba(212, 168, 67, 0.2);
    gap: 6px;
}

.month-block__sun-icon {
    width: 48px;
    height: 48px;
    color: #C8A45A;
    margin-bottom: 4px;
}

.month-block__month-input,
.month-block__year-input {
    font-family: 'Inter', sans-serif;
    text-align: center;
    border: none;
    border-bottom: 3px double #C8A45A;
    background: transparent;
    color: #1B2A4A;
    outline: none;
    padding: 4px 6px;
    width: 90px;
    transition: border-color 0.2s;
}

.month-block__month-input {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

.month-block__year-input {
    font-size: 0.75rem;
    font-weight: 600;
    color: #5A6A8A;
}

.month-block__month-input:focus,
.month-block__year-input:focus {
    border-color: #C8A45A;
}

.month-block__month-input::placeholder,
.month-block__year-input::placeholder {
    color: #B0B8C8;
    font-weight: 500;
}

/* Content area */
.month-block__content {
    flex: 1;
    min-width: 0;
}

/* Table */
.month-block__table {
    width: 100%;
}

.table-header {
    display: grid;
    grid-template-columns: 1fr 1fr 36px 36px;
    gap: 8px;
    padding: 10px 16px;
    background: #EAE0C8;
    color: #1B2A4A;
    border-bottom: 1px solid #D4A843;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.table-header span:nth-child(3),
.table-header span:nth-child(4) {
    /* spacer for icon + delete columns */
}

.table-row {
    display: grid;
    grid-template-columns: 1fr 1fr 36px 36px;
    gap: 8px;
    padding: 6px 16px;
    align-items: center;
    border-bottom: 1px solid rgba(212, 168, 67, 0.12);
    transition: background 0.15s;
}

.table-row:hover {
    background: rgba(212, 168, 67, 0.04);
}

.table-row__date,
.table-row__responsible {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    color: #1B2A4A;
    border: none;
    border-bottom: 1.5px solid #C8A45A;
    background: transparent;
    padding: 6px 4px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
}

.table-row__date:focus,
.table-row__responsible:focus {
    border-color: #C8A45A;
    border-bottom-width: 2px;
}

.table-row__date::placeholder,
.table-row__responsible::placeholder {
    color: #C0C8D8;
}

.table-row__person-icon {
    width: 22px;
    height: 22px;
    color: #A0AAC0;
    justify-self: center;
}

.table-row__delete-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    color: #D0A0A0;
    font-size: 1rem;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    justify-self: center;
}

.table-row__delete-btn:hover {
    background: rgba(192, 57, 43, 0.1);
    color: #c0392b;
}

.table-row__delete-btn svg {
    width: 16px;
    height: 16px;
}

/* Add row button */
.month-block__add-row-btn {
    display: block;
    width: 100%;
    padding: 10px 16px;
    border: none;
    border-top: 1px solid rgba(212, 168, 67, 0.15);
    background: transparent;
    color: #C8A45A;
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: background 0.2s, color 0.2s;
}

.month-block__add-row-btn:hover {
    background: rgba(212, 168, 67, 0.08);
    color: #A0842A;
}

/* ===== ADD MONTH BUTTON ===== */
.add-month-btn {
    display: block;
    margin: 16px auto 28px;
    padding: 12px 28px;
    border: 2px dashed #C8A45A;
    border-radius: 8px;
    background: transparent;
    color: #C8A45A;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
}

.add-month-btn:hover {
    background: rgba(212, 168, 67, 0.08);
    border-color: #C8A45A;
    color: #A0842A;
    transform: translateY(-1px);
}

/* ===== FOOTER ===== */
.footer {
    border-top: 2px solid #C8A45A;
    background: #F5F0E5;
}

.footer__quote-block {
    display: flex;
    align-items: center;
    padding: 20px 32px;
    gap: 20px;
}

.footer__book-icon {
    flex-shrink: 0;
}

.footer__book-icon svg {
    width: 56px;
    height: 56px;
}

.footer__quote-text {
    flex: 1;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    color: #1B2A4A;
    font-style: italic;
    line-height: 1.6;
}

.footer__quote-ref {
    font-style: normal;
    font-weight: 600;
    font-size: 0.8rem;
    color: #5A6A8A;
    margin-top: 4px;
}

.footer__illustration {
    flex-shrink: 0;
}

.footer__illustration svg {
    width: 160px;
    height: 90px;
}

.footer__actions {
    display: flex;
    justify-content: center;
    padding: 0 32px 20px;
}

.footer__export-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    border: 2px solid #1B2A4A;
    border-radius: 6px;
    background: #1B2A4A;
    color: #C8A45A;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
}

.footer__export-btn:hover {
    background: #2C3E6B;
    border-color: #2C3E6B;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(27, 42, 74, 0.2);
}

.footer__export-btn svg {
    flex-shrink: 0;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 700px) {
    body {
    background-color: #EFE6D5;
    background-image: radial-gradient(#C8A45A 0.5px, transparent 0.5px);
    background-size: 20px 20px;

        padding: 8px 2px;
    }

    .header {
        flex-direction: column;
        padding: 20px 16px;
        text-align: center;
    }

    .header__title {
        font-size: 1.2rem;
        letter-spacing: 1px;
    }

    .header__logo-icon {
        width: 60px;
        height: 60px;
    }

    .header__badge-inner {
        padding: 8px 12px;
        min-width: 60px;
    }

    .header__badge-number {
        font-size: 1.2rem;
    }

    .time-bar {
        padding: 12px 16px;
        flex-direction: column;
        align-items: flex-start;
    }

    .time-bar__controls {
        flex-wrap: wrap;
    }

    .time-bar__day-input {
        min-width: 140px;
        font-size: 0.8rem;
    }

    .month-block {
    border: 1px solid #C8A45A;
    border-radius: 4px;
    box-shadow: 3px 3px 0px rgba(200, 164, 90, 0.2);
    position: relative;

        flex-direction: column;
        margin: 12px 12px;
    }

    .month-block__sidebar {
        flex-direction: row;
        min-width: unset;
        padding: 12px 16px;
        border-right: none;
        border-bottom: 1px solid rgba(212, 168, 67, 0.2);
        gap: 12px;
    }

    .month-block__sun-icon {
        width: 36px;
        height: 36px;
        margin-bottom: 0;
    }

    .month-block__month-input,
    .month-block__year-input {
        width: 80px;
    }

    .table-header {
        grid-template-columns: 1fr 1fr 28px 28px;
        padding: 8px 10px;
        font-size: 0.65rem;
    }

    .table-row {
        grid-template-columns: 1fr 1fr 28px 28px;
        padding: 4px 10px;
        gap: 4px;
    }

    .table-row__date,
    .table-row__responsible {
        font-size: 0.8rem;
        padding: 4px 2px;
    }

    .footer__quote-block {
        flex-direction: column;
        padding: 16px;
        text-align: center;
    }

    .footer__illustration svg {
        width: 120px;
        height: 68px;
    }

    .add-month-btn {
        margin: 12px auto 20px;
        padding: 10px 20px;
        font-size: 0.8rem;
    }
}

/* ===== MEETING SCHEDULE (WEEKDAY & WEEKEND) ===== */
.meeting-block {
    margin: 20px 24px;
    border: 1px solid rgba(212, 168, 67, 0.25);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(27, 42, 74, 0.04);
    position: relative;
    animation: fadeIn 0.3s ease-out;
}

.meeting-block__delete-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 26px;
    height: 26px;
    border: none;
    background: rgba(255,255,255,0.7);
    color: #c0392b;
    font-size: 1.1rem;
    font-weight: 700;
    border-radius: 50%;
    cursor: pointer;
    z-index: 3;
    opacity: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}
.meeting-block:hover .meeting-block__delete-btn { opacity: 1; }
.meeting-block__delete-btn:hover { background: #c0392b; color: #fff; }

    const month = {

        month.rows.push(createEmptyRow());

// ===== DATA PERSISTENCE =====
function loadData() {
    const storageKey = SCHEDULE_TYPES[currentSchedule].key;
    try {
        const stored = localStorage.getItem(storageKey);
        if (stored) {
            data = JSON.parse(stored);
            return;
        }
    } catch (e) {
        console.warn('Failed to load data from localStorage:', e);
    }
    // Create default data with 2 month blocks
    data = JSON.parse(JSON.stringify(DEFAULT_DATA));
    data.months.push(createEmptyMonth());
    data.months.push(createEmptyMonth());
}

function saveData() {
    const storageKey = SCHEDULE_TYPES[currentSchedule].key;
    try {
        localStorage.setItem(storageKey, JSON.stringify(data));
    } catch (e) {
        console.warn('Failed to save data to localStorage:', e);
    }
}

function generateTimeOptions(selected) {
    let html = '';
    for (let h = 6; h <= 23; h++) {
        for (let m = 0; m < 60; m += 30) {
            const timeStr = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
            const isSelected = timeStr === selected ? ' selected' : '';
            html += `<option value="${timeStr}"${isSelected}>${timeStr}</option>`;
        }
    }
    return html;
}

// ===== UTILITY =====
function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function findMonthById(id) {
    return data.months.find(m => m.id === id) || null;
}

function findRowInMonth(month, rowId) {
    return month.rows.find(r => r.id === rowId) || null;
}

    saveData();
    render();
}

}

// ===== EVENT HANDLERS =====
function handleInput(e) {
    const target = e.target;
    const field = target.dataset.field;
    if (!field) return;

    const monthId = target.dataset.monthId;
    const rowId = target.dataset.rowId;

    if (field === 'meetingDay' || field === 'meetingTime') {
        data[field] = target.value;
        saveData();
        return;
    }

    if (monthId && !rowId && (field === 'name' || field === 'year')) {
        const month = findMonthById(monthId);
        if (month) {
            month[field] = target.value;
            saveData();
        }
        return;
    }

    if (monthId && rowId && (field === 'date' || field === 'responsible')) {
        const month = findMonthById(monthId);
        if (month) {
            const row = findRowInMonth(month, rowId);
            if (row) {
                row[field] = target.value;
                saveData();
            }
        }
        return;
    }
}

function handleClick(e) {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;

    const action = btn.dataset.action;
    const monthId = btn.dataset.monthId;
    const rowId = btn.dataset.rowId;

    switch (action) {
        case 'add-row': {
            const month = findMonthById(monthId);
            if (month) {
                month.rows.push(createEmptyRow());
                saveAndRender();
            }
            break;
        }

        case 'delete-row': {
            const month = findMonthById(monthId);
            if (month) {
                const row = findRowInMonth(month, rowId);
                if (row) {
                    const hasData = row.date.trim() || row.responsible.trim();
                    if (hasData) {
                        if (!confirm(t('deleteRowConfirm'))) {
                            return;
                        }
                    }
                    month.rows = month.rows.filter(r => r.id !== rowId);
                    saveAndRender();
                }
            }
            break;
        }

        case 'add-month': {
            data.months.push(createEmptyMonth());
            saveAndRender();
            setTimeout(() => {
                const blocks = document.querySelectorAll('.month-block');
                if (blocks.length > 0) {
                    blocks[blocks.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 100);
            break;
        }

        case 'delete-month': {
            const month = findMonthById(monthId);
            if (month) {
                const hasAnyData = month.name.trim() || month.year.trim() ||
                    month.rows.some(r => r.date.trim() || r.responsible.trim());
                if (hasAnyData) {
                    if (!confirm(t('deleteMonthConfirm'))) {
                        return;
                    }
                }
                data.months = data.months.filter(m => m.id !== monthId);
                saveAndRender();
            }
            break;
        }
    }
}

    const groupNameEl = document.getElementById('groupName');
    const groupNumberEl = document.getElementById('groupNumber');

    if (groupNameEl) {
        data.groupName = groupNameEl.textContent.trim();

}

// ===== MEETING EVENT HANDLERS =====
function handleMeetingInput(e) {
    const target = e.target;
    const field = target.dataset.field;
    if (!field) return;

    if (target.tagName.toLowerCase() === 'textarea') {
        target.style.height = 'auto';
        target.style.height = target.scrollHeight + 'px';
    }

    const meetingId = target.dataset.meetingId;
    const rowId = target.dataset.rowId;
    const section = target.dataset.section;

    if (!meetingId) return;

    const meeting = data.meetings.find(m => m.id === meetingId);
    if (!meeting) return;

    // Section row fields (weekday only)
    if (rowId && section && meeting[section]) {
        const row = meeting[section].find(r => r.id === rowId);
        if (row && (field === 'topic' || field === 'role' || field === 'name')) {
            row[field] = target.value;
            saveData();
            return;
        }
    }

    // Direct meeting fields
    if (field in meeting) {
        meeting[field] = target.value;
        saveData();
    }
}

function handleMeetingClick(e) {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;

    const action = btn.dataset.action;
    const meetingId = btn.dataset.meetingId;
    const section = btn.dataset.section;
    const rowId = btn.dataset.rowId;

    switch (action) {
        case 'add-meeting': {
            if (!data.meetings) data.meetings = [];
            if (currentSchedule === 'weekdays') {
                data.meetings.push(createWeekdayMeeting());
            } else {
                data.meetings.push(createWeekendMeeting());
            }
            saveData();
            renderCurrentSchedule();
            setTimeout(() => {
                const blocks = document.querySelectorAll('.meeting-block');
                if (blocks.length > 0) {
                    blocks[blocks.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 100);
            break;
        }

        case 'delete-meeting': {
            if (confirm(t('deleteMeetingConfirm'))) {
                data.meetings = data.meetings.filter(x => x.id !== meetingId);
                saveData();
                renderCurrentSchedule();
            }
            break;
        }

        case 'add-section-row': {
            if (meetingId && section) {
                const meeting = data.meetings.find(m => m.id === meetingId);
                if (meeting && meeting[section]) {
                    meeting[section].push(createWeekdayRow());
                    saveData();
                    renderCurrentSchedule();
                }
            }
            break;
        }

        case 'delete-section-row': {
            if (meetingId && section && rowId) {
                const meeting = data.meetings.find(m => m.id === meetingId);
                if (meeting && meeting[section]) {
                    const row = meeting[section].find(r => r.id === rowId);
                    if (row) {
                        const hasData = (row.topic || '').trim() || (row.name || '').trim();
                        if (hasData && !confirm(t('deleteRowConfirm'))) return;
                        meeting[section] = meeting[section].filter(r => r.id !== rowId);
                        saveData();
                        renderCurrentSchedule();
                    }
                }
            }
            break;
        }
    }
}

// ===== EXCEL IMPORT =====
function importFromExcel(mode) {
    if (typeof XLSX === 'undefined') {
        alert('Библиотека Excel не загружена. Проверьте подключение к интернету и обновите страницу.');
        return;
    }
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.xlsx,.xls,.csv';
    input.onchange = function(ev) {
        const file = ev.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const wb = XLSX.read(e.target.result, { type: 'binary', cellDates: true });
                const sheetName = wb.SheetNames[0];
                const sheet = wb.Sheets[sheetName];
                const allRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', blankrows: true });

                // Split into two blocks: separated by empty row(s) or title rows
                let block1 = [], block2 = [];
                let separatorFound = false;
                let headerSkipped1 = false, headerSkipped2 = false;

                for (let i = 0; i < allRows.length; i++) {
                    const row = allRows[i];
                    const isEmpty = row.every(c => c === '' || c === null || c === undefined);
                    if (!separatorFound) {
                        if (isEmpty) { if (block1.length > 0) separatorFound = true; continue; }
                        if (!headerSkipped1) { headerSkipped1 = true; continue; }
                        block1.push(row);
                    } else {
                        if (isEmpty) continue;
                        if (!headerSkipped2) { headerSkipped2 = true; continue; }
                        block2.push(row);
                    }
                }

                const cellStr = (v) => {
                    if (v === null || v === undefined || v === '') return '';
                    if (v instanceof Date) return v.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
                    return String(v).trim();
                };

                if (mode === 'att' || mode === 'both') {
                    if (block1.length > 0) {
                        data.attendantsRows = block1
                            .filter(r => r.some(c => c !== '' && c !== null))
                            .map(r => ({ id: generateId(), date: cellStr(r[0]), entrance: cellStr(r[1]), hall: cellStr(r[2]), mic1: cellStr(r[3]), mic2: cellStr(r[4]), ventilation: cellStr(r[5]) }));
                    }
                }
                if (mode === 'both') {
                    if (block2.length > 0) {
                        data.soundRows = block2
                            .filter(r => r.some(c => c !== '' && c !== null))
                            .map(r => ({ id: generateId(), date: cellStr(r[0]), audio: cellStr(r[1]), video: cellStr(r[2]), zoom: cellStr(r[3]) }));
                    }
                }

                saveData();
                renderCurrentSchedule();

                const imported = (data.attendantsRows || []).length + (data.soundRows || []).length;
                const msg = currentLang === 'uk' ? `Імпортовано ${imported} рядків!`
                          : currentLang === 'ro' ? `${imported} rânduri importate!`
                          : currentLang === 'en' ? `Imported ${imported} rows!`
                          : `Импортировано строк: ${imported}`;
                const toast = document.createElement('div');
                toast.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#2C3E6B;color:#C8A45A;padding:12px 20px;border-radius:8px;font-family:Inter,sans-serif;font-size:0.9rem;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.2)';
                toast.textContent = '✓ ' + msg;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            } catch (err) {
                alert('Ошибка при чтении файла: ' + err.message);
            }
        };
        reader.readAsBinaryString(file);
    };
    input.click();
}

function switchSchedule(type) {
    if (!SCHEDULE_TYPES[type]) return;

    if (data) saveData();

    currentSchedule = type;
    localStorage.setItem('activeScheduleType', type);

    const label = document.getElementById('currentScheduleLabel');
    if (label) label.textContent = SCHEDULE_TYPES[type].label;

    const items = document.querySelectorAll('.nav-bar__dropdown-item');
    items.forEach(item => {
        item.classList.remove('active');
        if (item.dataset.schedule === type) item.classList.add('active');
    });

    closeMenu();

    const header = document.querySelector('.header');
    const footer = document.querySelector('.footer');
    const container = document.getElementById('app-content');

    // Remove old event listeners by cloning
    const newContainer = container.cloneNode(false);
    container.parentNode.replaceChild(newContainer, container);

    if (type === 'preaching') {
        if (header) header.style.display = '';
        if (footer) footer.style.display = '';
        loadData();

        const groupNameEl = document.getElementById('groupName');
        const groupNumberEl = document.getElementById('groupNumber');
        if (groupNameEl && data.groupName) groupNameEl.textContent = data.groupName;
        if (groupNumberEl && data.groupNumber) groupNumberEl.textContent = data.groupNumber;

        render();
        updatePrintOrientation();

        const c = document.getElementById('app-content');
        if (c) {
            c.addEventListener('input', handleInput);
            c.addEventListener('change', handleInput);
            c.addEventListener('click', handleClick);
        }
    } else {
        if (header) header.style.display = 'none';
        if (footer) footer.style.display = 'none';

        loadData();
        if (type === 'attendants') {
            if (!data.attendantsRows) {
                data.attendantsRows = [createAttendantRow()];
                data.soundRows = [createSoundRow()];
                saveData();
            }
        if (!data.publishersGroups) {
            data.publishersGroups = [
                { id: generateId(), name: 'Группа № 1', rows: Array(14).fill().map((_, i) => ({ id: generateId(), num: i+1, name: '' })) },
                { id: generateId(), name: 'Группа № 2', rows: Array(14).fill().map((_, i) => ({ id: generateId(), num: i+1, name: '' })) },
                { id: generateId(), name: 'Группа № 3', rows: Array(14).fill().map((_, i) => ({ id: generateId(), num: i+1, name: '' })) },
                { id: generateId(), name: 'Группа № 4', rows: Array(14).fill().map((_, i) => ({ id: generateId(), num: i+1, name: '' })) }
            ];
        }
        if (!data.publishersSettings) {
            data.publishersSettings = { orientation: 'portrait', layout: '2-rows' };
        }

        } else if (!data.meetings) {
            data.meetings = [];
            if (type === 'weekdays') {
                data.meetings.push(createWeekdayMeeting());
                data.meetings.push(createWeekdayMeeting());
            } else if (type === 'publishers') { c.addEventListener('input', handlePublishersInput); c.addEventListener('click', handlePublishersClick); } else {
                data.meetings.push(createWeekendMeeting());
                data.meetings.push(createWeekendMeeting());
                data.meetings.push(createWeekendMeeting());
            }
            saveData();
        }

        renderCurrentSchedule();

        const c = document.getElementById('app-content');
        if (c) {
            if (type === 'attendants') {
                c.addEventListener('input', handleAttendantsInput);
                c.addEventListener('click', handleAttendantsClick);
            } else if (type === 'publishers') { c.addEventListener('input', handlePublishersInput); c.addEventListener('click', handlePublishersClick); } else {
                c.addEventListener('input', handleMeetingInput);
                c.addEventListener('change', handleMeetingInput);
                c.addEventListener('click', handleMeetingClick);
            }
        }
    }
}

function toggleLangMenu() {
    const dropdown = document.getElementById('langDropdown');
    if (dropdown) dropdown.classList.toggle('open');
}

function closeLangMenu() {
    const dropdown = document.getElementById('langDropdown');
    if (dropdown) dropdown.classList.remove('open');
}

function switchLanguage(lang) {
    if (!LANGS[lang]) return;
    currentLang = lang;
    localStorage.setItem('appLanguage', lang);

    SCHEDULE_TYPES = getScheduleTypes();

    const title = document.querySelector('.header__title');
    if (title) title.innerHTML = t('appTitle');

    const badgeLabel = document.querySelector('.header__badge-label');
    if (badgeLabel) badgeLabel.textContent = t('groupLabel');

    const quoteText = document.querySelector('.footer__quote-text p:first-child');
    if (quoteText) quoteText.innerHTML = t('quoteText');

    const quoteRef = document.querySelector('.footer__quote-ref');
    if (quoteRef) quoteRef.textContent = t('quoteRef');

    const exportBtn = document.getElementById('exportPdfBtn');
    if (exportBtn) {
        const svg = exportBtn.querySelector('svg');
        const svgHtml = svg ? svg.outerHTML : '';
        exportBtn.innerHTML = svgHtml + ' ' + t('exportPdf');
    }
    
    // Also update meeting PDF button if present
    const meetingExportBtn = document.getElementById('exportPdfBtnMeeting');
    if (meetingExportBtn) {
        meetingExportBtn.innerHTML = ICONS.pdf + ' ' + t('exportPdf');
    }

    const navLabel = document.getElementById('currentScheduleLabel');
    if (navLabel) navLabel.textContent = SCHEDULE_TYPES[currentSchedule].label;

    const items = document.querySelectorAll('.nav-bar__dropdown-item');
    items.forEach(item => {
        const type = item.dataset.schedule;
        if (type && SCHEDULE_TYPES[type]) {
            const svg = item.querySelector('svg');
            const svgHtml = svg ? svg.outerHTML : '';
            item.innerHTML = svgHtml + '\n                        ' + SCHEDULE_TYPES[type].fullLabel;
        }
    });

    const langLabel = document.getElementById('currentLangLabel');
    if (langLabel) langLabel.textContent = LANGS[lang].label;

    document.querySelectorAll('.lang-dropdown__item').forEach(el => {
        el.classList.toggle('active', el.dataset.lang === lang);
    });

    closeLangMenu();

    if (currentSchedule === 'preaching') {
        render();
    } else {
        renderCurrentSchedule();
    }
}

// ===== PUBLISHERS LIST =====
function updatePrintOrientation() {
    let styleId = 'print-page-style';
    let styleEl = document.getElementById(styleId);
    if (!styleEl) {
        styleEl = document.createElement('style');
        styleEl.id = styleId;
        document.head.appendChild(styleEl);
    }
    const appContainer = document.querySelector('.app');
    
    if (currentSchedule === 'publishers' && data.publishersSettings) {
        let orientation = data.publishersSettings.orientation || 'portrait';
        styleEl.innerHTML = '@page { size: ' + orientation + ' !important; margin: 5mm; }';
        if (appContainer) appContainer.style.maxWidth = orientation === 'landscape' ? '1100px' : '800px';
    } else {
        let orientation = (data.settings && data.settings.orientation) ? data.settings.orientation : 'landscape';
        styleEl.innerHTML = '@page { size: ' + orientation + ' !important; margin: 5mm; }';
        if (appContainer) appContainer.style.maxWidth = orientation === 'landscape' ? '1100px' : '800px';
    }
}

let draggedGroupId = null;
document.addEventListener('dragstart', (e) => {
    if (e.target.classList && e.target.classList.contains('pub-card')) {
        draggedGroupId = e.target.dataset.groupId;
        e.target.classList.add('dragging');
    }
});
document.addEventListener('dragend', (e) => {
    if (e.target.classList && e.target.classList.contains('pub-card')) {
        e.target.classList.remove('dragging');
        draggedGroupId = null;
    }
});
document.addEventListener('dragover', (e) => {
    if (draggedGroupId) e.preventDefault();
});
document.addEventListener('drop', (e) => {
    if (!draggedGroupId) return;
    e.preventDefault();
    const targetCard = e.target.closest('.pub-card');
    if (targetCard && targetCard.dataset.groupId !== draggedGroupId) {
        const targetId = targetCard.dataset.groupId;
        const groups = data.publishersGroups;
        const draggedIndex = groups.findIndex(g => g.id === draggedGroupId);
        const targetIndex = groups.findIndex(g => g.id === targetId);
        const [draggedGroup] = groups.splice(draggedIndex, 1);
        groups.splice(targetIndex, 0, draggedGroup);
        saveData();
        if (currentSchedule === 'publishers') renderPublishers();
    }
});

function renderPublishers() {
    const container = document.getElementById('app-content');
    if (!container) return;
    updatePrintOrientation();
    if (!data.publishersGroups) {
        data.publishersGroups = [
            { id: generateId(), name: 'Группа № 1', rows: Array(14).fill().map((_, i) => ({ id: generateId(), num: i+1, name: '' })) },
            { id: generateId(), name: 'Группа № 2', rows: Array(14).fill().map((_, i) => ({ id: generateId(), num: i+1, name: '' })) },
            { id: generateId(), name: 'Группа № 3', rows: Array(14).fill().map((_, i) => ({ id: generateId(), num: i+1, name: '' })) },
            { id: generateId(), name: 'Группа № 4', rows: Array(14).fill().map((_, i) => ({ id: generateId(), num: i+1, name: '' })) }
        ];
    }
    if (!data.publishersSettings) {
        data.publishersSettings = { orientation: 'portrait', layout: '2-rows' };
    }
    
    const mainTitle = document.querySelector('.header__title');
    if (mainTitle) {
        mainTitle.innerHTML = (t('schedPublishersFull') || 'СПИСОК ВОЗВЕЩАТЕЛЕЙ').toUpperCase();
    }
    
    let columns = data.publishersGroups.length;
    if (data.publishersSettings && data.publishersSettings.layout === '2-rows') {
        columns = Math.ceil(data.publishersGroups.length / 2);
        if (columns < 1) columns = 1;
    }
    let gridStyle = 'grid-template-columns: repeat(' + columns + ', 1fr);';

    let html = '<div class="publishers-toolbar no-print">' +
        '<div class="pub-settings">' +
            '<label>' + (t('orientation') || 'Ориентация:') + 
                ' <select data-field="orientation">' +
                    '<option value="portrait" ' + (data.publishersSettings.orientation==='portrait'?'selected':'') + '>📄 ' + (t('portrait') || 'Книжная') + '</option>' +
                    '<option value="landscape" ' + (data.publishersSettings.orientation==='landscape'?'selected':'') + '>🖼 ' + (t('landscape') || 'Альбомная') + '</option>' +
                '</select>' +
            '</label>' +
            '<label style="margin-left: 15px;">' + (t('layoutOptions') || 'Отображение:') + 
                ' <select data-field="layout">' +
                    '<option value="1-row" ' + (data.publishersSettings.layout==='1-row'?'selected':'') + '>' + (t('layoutRow1') || 'В 1 ряд') + '</option>' +
                    '<option value="2-rows" ' + (data.publishersSettings.layout==='2-rows'?'selected':'') + '>' + (t('layoutRow2') || 'В 2 ряда') + '</option>' +
                '</select>' +
            '</label>' +
            '<button style="margin-left: 15px;" class="add-pub-group-btn" data-action="import-excel">📥 Импорт Excel</button>' +
        '</div>' +
        '<div>' +
            '<button style="margin-right: 15px; background: #D4A843; color: #1B2A4A;" class="add-pub-group-btn" data-action="export-pdf">🖨️ PDF</button>' +
            '<button class="add-pub-group-btn" data-action="add-group">' + (t('addGroup') || '+ Добавить группу') + '</button>' +
        '</div>' +
    '</div>' +
    '<div class="publishers-grid" style="' + gridStyle + '">';
    
    data.publishersGroups.forEach((group, gIndex) => {
        html += '<div class="pub-card" draggable="true" data-group-id="' + group.id + '">' +
            '<div class="pub-card-header">' +
                '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="opacity:0.8; margin-right: 8px;"><path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C4,7.25 7,11.5 7,11.5C7,11.5 12,8 17,8Z"/></svg>' +
                '<input type="text" value="' + escapeHtmlAtt(group.name) + '" data-group-id="' + group.id + '" data-field="groupName">' +
                '<button class="pub-delete-group-btn no-print" data-action="delete-group" data-group-id="' + group.id + '" title="' + (t('delGroup') || 'Удалить') + '">×</button>' +
            '</div>' +
            '<div class="pub-card-body">';
        
        group.rows.forEach((row, rIndex) => {
            html += '<div class="pub-row">' +
                    '<span class="pub-num" style="font-size: 0.8em; opacity: 0.6; font-weight: normal; border-right: 1px solid #e0e0e0; margin-right: 8px; padding-right: 6px; text-align: right; width: 22px; display: inline-block;">' + row.num + '.</span>' +
                    '<input type="text" ' + (rIndex < 2 ? 'style="font-weight: bold;" ' : '') + 'value="' + escapeHtmlAtt(row.name) + '" data-group-id="' + group.id + '" data-row-id="' + row.id + '" data-field="pubName">' +
                    '<button class="pub-delete-row-btn no-print" data-action="delete-row" data-group-id="' + group.id + '" data-row-id="' + row.id + '">×</button>' +

            '</div>' +
            '<div class="pub-card-footer">' +
                '<svg viewBox="0 0 50 10" width="50" height="10"><path d="M0 5 Q 25 10 50 5 Q 25 0 0 5 Z" fill="#2c4c3b" opacity="0.3"/></svg>' +
            '</div>' +

    });
    
    html += '</div>';
    container.innerHTML = html;
}
function handlePublishersInput(e) {
    const el = e.target;
    const field = el.dataset.field;
    if (field === 'orientation' || field === 'layout') {
        data.publishersSettings[field] = el.value;
        saveData();
        renderPublishers();
    }
    else if (field === 'groupName') {
        const group = data.publishersGroups.find(g => g.id === el.dataset.groupId);
        if (group) group.name = el.value;
        saveData();
    }
    else if (field === 'pubName') {
        const group = data.publishersGroups.find(g => g.id === el.dataset.groupId);
        if (group) {
            const row = group.rows.find(r => r.id === el.dataset.rowId);
            if (row) row.name = el.value;
        }
        saveData();
    }
}

function handlePublishersClick(e) {
    const btn = e.target.closest('button');
    if (!btn) return;
    const action = btn.dataset.action;
    
    if (action === 'export-pdf') {
        window.print();
    }
    else if (action === 'import-excel') {
        importPublishersFromExcel();
    }
    else if (action === 'add-group') {
        data.publishersGroups.push({
            id: generateId(),
            name: 'Нова група',
            rows: Array(14).fill().map((_, i) => ({ id: generateId(), num: i+1, name: '' }))
        });
        saveData();
        renderPublishers();
    }
    else if (action === 'delete-group') {
        if (confirm('Видалити цю групу? / Удалить эту группу?')) {
            data.publishersGroups = data.publishersGroups.filter(g => g.id !== btn.dataset.groupId);
            saveData();
            renderPublishers();
        }
    }
    else if (action === 'add-row') {
        const group = data.publishersGroups.find(g => g.id === btn.dataset.groupId);
        if (group) {
            group.rows.push({ id: generateId(), num: group.rows.length + 1, name: '' });
            saveData();
            renderPublishers();
        }
    }
    else if (action === 'delete-row') {
        const group = data.publishersGroups.find(g => g.id === btn.dataset.groupId);
        if (group) {
            group.rows = group.rows.filter(r => r.id !== btn.dataset.rowId);
            group.rows.forEach((r, i) => r.num = i + 1);
            saveData();
            renderPublishers();
        }
    }
}

function importPublishersFromExcel() {
    if (typeof XLSX === 'undefined') {
        alert('Библиотека Excel не загружена. Проверьте подключение к интернету.');
        return;
    }
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.xlsx,.xls,.csv';
    input.onchange = function(ev) {
        const file = ev.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const wb = XLSX.read(e.target.result, { type: 'binary', cellDates: true });
                const sheetName = wb.SheetNames[0];
                const sheet = wb.Sheets[sheetName];
                const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', blankrows: true });
                
                if (!rows || rows.length === 0) {
                    alert('Файл пустой.');
                    return;
                }
                
                let maxCols = 0;
                rows.forEach(r => { if (r.length > maxCols) maxCols = r.length; });
                
                let newGroups = [];
                for (let col = 0; col < maxCols; col++) {
                    let header = rows[0][col] ? String(rows[0][col]).trim() : 'Группа № ' + (col+1);
                    newGroups.push({ id: generateId(), name: header, rows: [] });
                }
                
                for (let r = 1; r < rows.length; r++) {
                    for (let c = 0; c < maxCols; c++) {
                        let cellValue = rows[r][c] ? String(rows[r][c]).trim() : '';
                        if (cellValue) {
                            newGroups[c].rows.push({
                                id: generateId(),
                                num: newGroups[c].rows.length + 1,
                                name: cellValue
                            });
                        }
                    }
                }
                
                newGroups.forEach(g => {
                    while(g.rows.length < 5) {
                        g.rows.push({ id: generateId(), num: g.rows.length + 1, name: '' });
                    }
                });
                
                data.publishersGroups = newGroups;
                saveData();
                renderPublishers();
                
                const toast = document.createElement('div');
                toast.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#2C3E6B;color:#C8A45A;padding:12px 20px;border-radius:8px;font-family:Inter,sans-serif;font-size:0.9rem;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.2)';
                toast.textContent = '✔️ Успешно импортировано групп: ' + newGroups.length;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            } catch (err) {
                alert('Ошибка при чтении файла: ' + err.message);
            }
        };
        reader.readAsBinaryString(file);
    };
    input.click();
}
